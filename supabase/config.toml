# Minimal Supabase CLI config for local development (`supabase start`).
project_id = "hawwely"

[api]
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
port = 54323

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/api/auth/callback", "https://hawwely.com/api/auth/callback"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
